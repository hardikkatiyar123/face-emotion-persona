<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Face Emotion Persona</title>
  <meta name="description" content="Live facial emotion detection with a persona for every mood. Runs entirely in your browser; your video is never uploaded.">
  <meta name="theme-color" content="#0a0e16">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="site-header">
    <h1 class="brand"><span class="brand-dot" aria-hidden="true"></span>Face Emotion Persona</h1>
    <span class="badge">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      On-device<span class="badge-extra">· nothing uploaded</span>
    </span>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Camera view">
      <video id="video" playsinline muted></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <span class="fps" id="fps" aria-hidden="true"></span>
      <div class="flash" id="flash" aria-hidden="true"></div>

      <div class="start-screen">
        <button id="start" class="start-btn" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          <span id="start-label">Loading models…</span>
        </button>
        <p class="start-note">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Your video never leaves this device.
        </p>
      </div>
    </section>

    <div class="side">
      <section class="card persona-card" aria-label="Your persona">
        <p class="eyebrow" id="readout-caption">Current expression</p>
        <p class="readout-line">
          <span class="readout" id="readout">—</span>
          <span class="readout-pct" id="readout-pct"></span>
        </p>
        <div class="persona" id="persona">
          <span class="persona-emoji" id="persona-emoji" aria-hidden="true">🙂</span>
          <div>
            <p class="persona-name" id="persona-name">Waiting for a face</p>
            <p class="persona-tagline" id="persona-tagline">Start the camera to meet your persona.</p>
          </div>
        </div>
        <p class="sr-only" id="announce" aria-live="polite"></p>
      </section>

      <section class="card bars-card" aria-label="All emotions">
        <p class="eyebrow">All emotions</p>
        <ul class="bars" id="bars"></ul>
      </section>

      <section class="card controls" aria-label="Controls">
        <button id="toggle" class="btn btn-primary" disabled>Loading…</button>
        <button id="snapshot" class="btn" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Take snapshot
        </button>
        <label class="model-pick">
          <span>Model</span>
          <select id="model" aria-describedby="model-note">
            <option value="hsemotion" disabled>HSEmotion (loading…)</option>
            <option value="builtin" selected>Built-in (face-api.js)</option>
            <option value="custom" disabled>My trained model (not found)</option>
          </select>
        </label>
        <p class="model-note" id="model-note">Loading the HSEmotion model (16 MB)…</p>
        <p class="status" id="status" role="status">Loading face models…</p>
      </section>
    </div>
  </main>

  <!-- face-api.js bundles TensorFlow.js; we reuse its tf for the custom model -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
  <!-- onnxruntime-web runs the HSEmotion model (WebGPU when available, otherwise WebAssembly) -->
  <script defer src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
